name: One-time Fazzcart copy fix

on:
  push:
    branches: [manglo-dev]
    paths:
      - '.github/workflows/one-time-fazzcart-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manglo-dev
      - name: Correct Fazzcart business description
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/about/page.tsx')
          text = path.read_text()
          old = 'a live e-commerce business selling physical products'
          new = 'a live e-commerce business selling both physical and digital products'
          if old not in text:
              raise SystemExit('Expected founder copy not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/about/page.tsx
          git commit -m 'Clarify Fazzcart physical and digital products'
          git push origin HEAD:manglo-dev
