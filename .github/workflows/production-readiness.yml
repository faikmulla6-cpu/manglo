name: Production readiness

on:
  push:
    branches: [manglo-dev, design/manglo-editorial-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://manglo.shop
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify routes and static assets
        run: npm run verify:surface

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Production build
        run: npm run build
