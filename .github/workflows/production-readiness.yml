name: Production readiness

on:
  push:
    branches: [manglo-dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        if: github.event_name == 'push'
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist lockfile repair
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh dependency lockfile"
            git push
          fi

      - name: Install exactly from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run security:audit
