name: One-time CSS compatibility fix

on:
  push:
    branches: [manglo-dev]
    paths:
      - '.github/workflows/one-time-css-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manglo-dev
      - name: Replace legacy end alignment safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/dashboard/PremiumAccount.module.css')
          text = path.read_text()
          updated = text.replace('align-items:end', 'align-items:flex-end')
          if updated == text:
              print('No compatibility replacements needed.')
          else:
              path.write_text(updated)
              print(f'Replaced {text.count("align-items:end")} declaration(s).')
          PY
      - name: Commit exact compatibility change
        run: |
          if git diff --quiet -- app/dashboard/PremiumAccount.module.css; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/PremiumAccount.module.css
          git commit -m 'Fix order form flex alignment compatibility'
          git push origin HEAD:manglo-dev
