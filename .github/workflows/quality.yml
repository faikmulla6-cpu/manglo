name: Manglo quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site and browser bundle
        run: npm run build
      - name: Type-check
        run: npm run typecheck
      - name: Run editorial, routing and tool tests
        run: npm test
      - name: Audit canonical pages and preapproval safeguards
        run: npm run audit:site
      - name: Check internal links and image alternatives
        run: npm run audit:links
