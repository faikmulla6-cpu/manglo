name: One-time About CSS module fix

on:
  push:
    branches: [manglo-dev]
    paths:
      - '.github/workflows/one-time-about-css-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manglo-dev
      - name: Scope About reveal selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/about/About.module.css')
          text=path.read_text()
          text=text.replace('[data-about-reveal]{','.page [data-about-reveal]{')
          text=text.replace('[data-about-reveal][data-about-visible="true"]{','.page [data-about-reveal][data-about-visible="true"]{')
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/about/About.module.css
          git commit -m 'Scope About reveal selectors for CSS modules'
          git push origin HEAD:manglo-dev
